{{- /*
DSN Secret — only rendered when the chart is asked to create one (i.e. no
database.existingSecret was provided but a url is available, either explicitly
or from the eval-only bundled Postgres). The preferred production path is to
reference an existing Secret via database.existingSecret and NOT render this.
*/ -}}
{{- if eq (include "janus.createDatabaseSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "janus.fullname" .) }}
  labels:
    {{- include "janus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "janus.databaseSecretKey" . }}: {{ .Values.database.url | default (include "janus.bundledDatabaseUrl" .) | quote }}
{{- end }}
{{- if eq (include "janus.createMetricsSecret" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "janus.metricsSecretName" . }}
  labels:
    {{- include "janus.labels" . | nindent 4 }}
type: Opaque
stringData:
  JANUS_METRICS_TOKEN: {{ .Values.metrics.token | quote }}
{{- end }}
