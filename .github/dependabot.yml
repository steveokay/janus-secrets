version: 2
updates:
  # ---- Go modules -------------------------------------------------------
  # Server + CLI (the primary module). Grouped so a week's bumps arrive as
  # one reviewable PR instead of a swarm.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-modules:
        patterns: ["*"]

  # Go SDK (its own module).
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-modules:
        patterns: ["*"]

  # Terraform provider (its own module).
  - package-ecosystem: gomod
    directory: /terraform-provider-janus
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-modules:
        patterns: ["*"]

  # ---- npm --------------------------------------------------------------
  # Atrium SPA (embedded into the binary via go:embed).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 7 (the native port) breaks svelte-check / the current
      # toolchain; a major TS migration is deliberate work, not an automated
      # bump. Minor/patch TS updates still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  # TypeScript SDK.
  - package-ecosystem: npm
    directory: /sdk/ts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # See /web above — hold major TypeScript bumps until the SDK toolchain
      # is verified against them (sdk/ts is not yet built in CI).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  # ---- Python -----------------------------------------------------------
  # Python SDK (stdlib-only runtime; this tracks build/dev deps in pyproject).
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip:
        patterns: ["*"]

  # ---- GitHub Actions ---------------------------------------------------
  # Pin-bump the actions used by ci.yml / release.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
