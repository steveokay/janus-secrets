name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write # create the GitHub Release + upload artifacts
  packages: write # push images to GHCR
  id-token: write # Cosign keyless signing + provenance (OIDC)
  attestations: write # actions/attest-* build-provenance & SBOM attestations
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # Non-interactive Cosign for the goreleaser signs/docker_signs hooks.
      COSIGN_YES: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Build web assets (embedded into the binary)
        run: |
          cd web
          npm ci
          npm run build
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser (build, sign, SBOM, push)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- SLSA build provenance -------------------------------------------
      # Binaries/archives + checksums: a signed provenance attestation stored
      # in the GitHub attestations API (verify with `gh attestation verify`).
      - name: Attest binary/archive provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # Resolve the pushed multi-arch manifest digest so image attestations
      # bind to an immutable reference, not a mutable tag.
      - name: Resolve image digest
        id: img
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/steveokay/janus"
          digest="$(docker buildx imagetools inspect "${image}:${version}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "resolved ${image}:${version} -> ${digest}"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/steveokay/janus
          subject-digest: ${{ steps.img.outputs.digest }}
          push-to-registry: true

      # Container SBOM (Syft) + attestation attached to the image.
      - name: Generate image SBOM
        run: |
          set -euo pipefail
          syft "ghcr.io/steveokay/janus@${{ steps.img.outputs.digest }}" \
            -o spdx-json=image.sbom.spdx.json
      - name: Attest image SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ghcr.io/steveokay/janus
          subject-digest: ${{ steps.img.outputs.digest }}
          sbom-path: image.sbom.spdx.json
          push-to-registry: true
