name: ci

on:
  push:
    branches: [main, 'milestone-*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
        # `go test` defaults to a 10-MINUTE timeout, and internal/api under
        # -race now sits right on that line (~600s and climbing as tests are
        # added). It tipped over in PR #202 — a web-and-docs-only change with no
        # Go in it at all — which is the tell that this is a clock, not a defect.
        # A timeout panic is indistinguishable at a glance from a real failure,
        # so the cost is not just a red run: it is a red run that lies about why.
        # 30m is headroom, still short enough to catch a genuine hang.
      - run: go test -race -timeout 30m ./...
      - name: enforce 100% coverage on internal/crypto
        run: |
          go test -coverprofile=crypto.out ./internal/crypto
          pct=$(go tool cover -func=crypto.out | tail -1 | awk '{print $3}')
          echo "internal/crypto coverage: $pct"
          if [ "$pct" != "100.0%" ]; then
            echo "coverage gate failed: internal/crypto must be 100.0%"
            exit 1
          fi
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -exclude-dir=internal/crypto/shamir ./...

  helm:
    # The Helm chart had NO CI at all, which is exactly why three defects
    # survived until it was first deployed for real: a Service selector that
    # also matched the bundled Postgres (breaking the `kubectl port-forward
    # svc/janus` the chart's own NOTES.txt prescribes for unsealing), an
    # unknown seal.type rendering happily into the pod env, and default values
    # that produced a pod which could never unseal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: helm lint
        run: helm lint deploy/helm/janus --set seal.type=shamir
      - name: render every seal mode
        # Each render GREPS for the configured value in the output. A previous
        # version piped to /dev/null, so a validator checking a values key that
        # did not exist (gcpkms.keyName vs the real gcpkms.key) passed CI while
        # breaking every correctly-configured GCP install.
        run: |
          set -euo pipefail
          helm template t deploy/helm/janus --set seal.type=shamir > /dev/null
          helm template t deploy/helm/janus --set seal.type=awskms \
            --set seal.awskms.keyArn=arn:aws:kms:us-east-1:1:key/x \
            | grep -q 'arn:aws:kms:us-east-1:1:key/x'
          helm template t deploy/helm/janus --set seal.type=gcpkms \
            --set seal.gcpkms.key=projects/p/locations/l/keyRings/r/cryptoKeys/k \
            | grep -q 'projects/p/locations/l/keyRings/r/cryptoKeys/k'
          helm template t deploy/helm/janus --set seal.type=azurekv \
            --set seal.azurekv.vaultUrl=https://v.vault.azure.net \
            --set seal.azurekv.keyName=k \
            | grep -q 'https://v.vault.azure.net'
      - name: reject an invalid or incomplete seal config
        run: |
          set -euo pipefail
          for args in "--set seal.type=bogus" "--set seal.type=awskms" \
                      "--set seal.type=gcpkms" "--set seal.type=azurekv"; do
            if helm template t deploy/helm/janus $args > /dev/null 2>&1; then
              echo "expected a template failure for: $args" >&2
              exit 1
            fi
          done
      - name: the API Service must select ONLY the server pod
        run: |
          set -euo pipefail
          helm template t deploy/helm/janus --set seal.type=shamir \
            --set postgresql.enabled=true > /tmp/rendered.yaml
          python3 - <<'PY'
          import re, sys, yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          svc = next(d for d in docs if d['kind'] == 'Service'
                     and d['metadata']['labels'].get('app.kubernetes.io/component') != 'postgresql')
          sel = svc['spec']['selector']
          if sel.get('app.kubernetes.io/component') != 'server':
              print('API Service selector must pin component=server, got', sel, file=sys.stderr)
              sys.exit(1)
          sts = next(d for d in docs if d['kind'] == 'StatefulSet')
          pg = sts['spec']['template']['metadata']['labels']
          if all(pg.get(k) == v for k, v in sel.items()):
              print('the bundled Postgres pod still matches the API Service selector', file=sys.stderr)
              sys.exit(1)
          print('ok: API Service selects only the server pod')
          PY
      - name: the outbound allowlist renders only when set
        run: |
          set -euo pipefail
          if helm template t deploy/helm/janus --set seal.type=shamir \
             | grep -q 'JANUS_OUTBOUND_ALLOW'; then
            echo "JANUS_OUTBOUND_ALLOW must not render when env.outboundAllow is empty" >&2
            exit 1
          fi
          helm template t deploy/helm/janus --set seal.type=shamir \
            --set-string env.outboundAllow=10.96.0.1/32 \
            | grep -q '10.96.0.1/32'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # >= 22.18 so `node --test` can run the TypeScript unit tests directly
          # via native type stripping (no bundler, no test-runner dependency).
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck (svelte-check + tsc)
        run: npm run check
      - name: unit tests (node --test)
        run: npm test
      - name: build bundle
        run: npm run build

  # `go test ./...` in the `test` job above covers the ROOT module only — the
  # `./...` pattern does not descend into nested modules. sdk/go and
  # terraform-provider-janus each have their own go.mod, so until this job
  # existed they were never built, vetted or tested by CI, and Dependabot
  # (which watches all three gomod directories) could land a bump in either
  # with nothing verifying it.
  go-modules:
    name: go-module (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [sdk/go, terraform-provider-janus]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -timeout 15m ./...

  sdk-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      - run: npm ci
      - name: typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: unit tests
        run: npm test

  sdk-python:
    name: sdk-python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range: '3.9' is the FLOOR that
        # `requires-python = ">=3.9"` advertises — testing only on a modern
        # interpreter would let a 3.10-only construct through and quietly break
        # the compatibility the package promises — and '3.13' catches removals
        # and deprecations coming the other way. The SDK is stdlib-only, so
        # there is nothing to install and both runs are cheap.
        python-version: ['3.9', '3.13']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t . -v

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
