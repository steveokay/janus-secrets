name: e2e (opt-in)

# Browser E2E smoke suite — deliberately NOT part of the per-PR ci.yml gate.
# It stands up a full docker-compose stack (server + Postgres) and unseals it,
# which is too heavy/flaky to run on every PR. Trigger it manually, or by adding
# the `e2e` label to a PR.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  smoke:
    # Only run on label events when the label is exactly `e2e`; always run on
    # manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the stack (server + Postgres)
        run: docker compose up -d --build

      - name: Wait for the server to become healthy
        run: |
          echo "Waiting for http://localhost:8210/v1/sys/ready …"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8210/v1/sys/ready >/dev/null 2>&1; then
              echo "server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become ready in time"
          docker compose ps
          docker compose logs janus
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite
        working-directory: web
        env:
          JANUS_E2E_BASE_URL: http://localhost:8210
        run: npm run test:e2e

      - name: Dump server logs on failure
        if: failure()
        run: docker compose logs janus

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
