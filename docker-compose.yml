# ============================================================================
# DEV-ONLY STACK. This compose file is a local development convenience, not a
# production template. It hardcodes a well-known Postgres password
# (POSTGRES_PASSWORD: janus-dev) and connects with sslmode=disable, and both
# services bind only to 127.0.0.1 (loopback) so nothing is exposed off-host.
#
# For any shared or production deployment:
#   - Do NOT hardcode the DB password here. Source it from a secret / env-file
#     (e.g. an unversioned .env, Docker/compose secrets, or your orchestrator's
#     secret store) and inject it into both the DB and JANUS_DATABASE_URL.
#   - Use TLS to Postgres: sslmode=require (or stronger, verify-full).
#   - See docs/guides/production-deployment.md for the production-shaped stack.
# ============================================================================
#
# Resource limits below are conservative *starting points* for a small
# single-node deployment. Tune them to your host and workload — measure real
# memory/CPU use under load and adjust. `deploy.resources` is honored by
# `docker compose up` (Compose v2 applies limits without Swarm).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: janus
      # DEV-ONLY hardcoded password. In production, source this from a secret /
      # env-file — never commit a real DB password. See the header comment.
      POSTGRES_PASSWORD: janus-dev
      POSTGRES_DB: janus
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus -d janus"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m

  janus:
    build: .
    command: server
    environment:
      # DEV-ONLY: hardcoded password + sslmode=disable. Production must source
      # the password from a secret and use sslmode=require. See header comment.
      JANUS_DATABASE_URL: postgres://janus:janus-dev@postgres:5432/janus?sslmode=disable
      JANUS_SEAL_TYPE: shamir
      # Passkeys (WebAuthn). The dev stack is published on localhost:8210 and
      # browsers treat http://localhost as a secure context, so the ceremony
      # works without TLS here. Production MUST use the real registrable domain
      # and https:// origins — see docs/guides/two-factor-auth.md.
      JANUS_WEBAUTHN_RP_ID: localhost
      JANUS_WEBAUTHN_ORIGINS: http://localhost:8210
      JANUS_WEBAUTHN_RP_NAME: Janus (dev)
    ports:
      - "127.0.0.1:8210:8200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 128m

volumes:
  pgdata:
