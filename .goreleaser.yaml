version: 2
project_name: janus
before:
  hooks:
    - go mod tidy
builds:
  - id: janus
    main: ./cmd/janus
    binary: janus
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/steveokay/janus-secrets/internal/version.Version={{.Version}}
      - -X github.com/steveokay/janus-secrets/internal/version.Commit={{.ShortCommit}}
      - -X github.com/steveokay/janus-secrets/internal/version.Date={{.Date}}
archives:
  - id: janus
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
checksum:
  name_template: checksums.txt
  algorithm: sha256
# Syft SBOM per release archive (attached to the GitHub Release).
sboms:
  - id: archives
    artifacts: archive
# Cosign keyless (OIDC) signature over the checksums file. Signing the
# checksum + publishing the cert lets a consumer verify every artifact via
# `cosign verify-blob --certificate ... --signature ... checksums.txt`.
# Requires the release workflow to run with `id-token: write` and COSIGN_YES.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
dockers:
  - id: janus-amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.release
    image_templates:
      - "ghcr.io/steveokay/janus:{{ .Version }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
  - id: janus-arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.release
    image_templates:
      - "ghcr.io/steveokay/janus:{{ .Version }}-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
docker_manifests:
  - name_template: "ghcr.io/steveokay/janus:{{ .Version }}"
    image_templates:
      - "ghcr.io/steveokay/janus:{{ .Version }}-amd64"
      - "ghcr.io/steveokay/janus:{{ .Version }}-arm64"
  - name_template: "ghcr.io/steveokay/janus:latest"
    image_templates:
      - "ghcr.io/steveokay/janus:{{ .Version }}-amd64"
      - "ghcr.io/steveokay/janus:{{ .Version }}-arm64"
# Cosign keyless signature over the pushed multi-arch manifests (what users
# pull by tag). Signs by digest so the signature is immutable.
docker_signs:
  - id: manifests
    cmd: cosign
    artifacts: manifests
    output: true
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"
# Auto-flag pre-release tags (…-rc1, -beta, -alpha) as GitHub pre-releases so a
# release candidate never displaces a stable tag as "Latest".
release:
  prerelease: auto
changelog:
  use: github
  sort: asc
  groups:
    - { title: Features, regexp: "^feat", order: 0 }
    - { title: Fixes, regexp: "^fix", order: 1 }
    - { title: Others, order: 999 }
